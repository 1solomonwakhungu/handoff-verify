[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "handoff-verify"
version = "0.1.1"
description = "Deterministic, zero-LLM claim and scope verification for AI coding agents and subagents."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Solomon Wakhungu" }]
requires-python = ">=3.11"
keywords = [
    "claude-code",
    "codex",
    "ai-agents",
    "verification",
    "transcripts",
    "subagents",
    "hooks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/1solomonwakhungu/handoff-verify"
Documentation = "https://github.com/1solomonwakhungu/handoff-verify#readme"
Repository = "https://github.com/1solomonwakhungu/handoff-verify"
Issues = "https://github.com/1solomonwakhungu/handoff-verify/issues"

[project.scripts]
handoff-verify = "handoff_verify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/handoff_verify"]

[tool.hatch.build.targets.wheel.force-include]
"evals" = "handoff_verify/_evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handoff-verify"
version = "0.1.0"
description = "Deterministic, zero-LLM claim and scope verification for AI coding agents and subagents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
handoff-verify = "handoff_verify.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/handoff_verify"]

[tool.hatch.build.targets.wheel.force-include]
"evals" = "handoff_verify/_evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

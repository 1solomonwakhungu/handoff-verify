version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /landing-page
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      landing-page-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(landing-page)"

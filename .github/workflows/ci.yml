name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: uv sync --dev
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run unit and integration tests
        run: uv run pytest -v
      - name: Run bundled 32-case eval suite
        run: uv run handoff-verify eval --verbose

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: uv build
      - name: Verify wheel install and CLI in an isolated environment
        run: |
          python3 - <<'PY'
          import glob
          import pathlib
          import subprocess
          import tarfile
          import tempfile
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          sdists = sorted(glob.glob("dist/*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)

          with tarfile.open(sdists[0], "r:gz") as tf:
              sdist_names = tf.getnames()
              assert not any("/landing-page/" in n or n.endswith("/landing-page") for n in sdist_names), sdist_names
              for required in (
                  "/evals/manifest.json",
                  "/skills/handoff-verify/SKILL.md",
                  "/hooks/hooks.json",
                  "/bin/handoff-verify",
                  "/.claude-plugin/plugin.json",
                  "/tests/",
              ):
                  assert any(required in n for n in sdist_names), f"Missing {required} in sdist"

          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
              assert "handoff_verify/_evals/manifest.json" in names
              assert any(n.endswith("licenses/LICENSE") for n in names)

          with tempfile.TemporaryDirectory() as td:
              venv = pathlib.Path(td) / "venv"
              subprocess.run(["uv", "venv", str(venv)], check=True)
              subprocess.run(
                  ["uv", "pip", "install", "--python", str(venv / "bin/python"), wheels[0]],
                  check=True,
              )
              hv = str(venv / "bin/handoff-verify")
              subprocess.run([hv, "--version"], cwd=td, check=True)
              subprocess.run([hv, "eval", "--json"], cwd=td, check=True)
              subprocess.run([hv, "doctor", "--json"], cwd=td, check=True)
          PY

  landing-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: landing-page/package-lock.json
      - name: Install landing page dependencies
        run: npm ci
      - name: Typecheck landing page
        run: npm run typecheck
      - name: Build landing page
        run: npm run build
